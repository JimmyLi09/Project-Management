<style>
/* Layout: blueprint-style workbench — sticky business tabs, each business = gantt + flow + checklist + watch-outs, all vector */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --ink:#15202B; --muted:#5A6876; --line:#CBD4DC; --grid:#DCE3E9;
  --warn:#B4531A; --ok:#2E7D4F;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-head:"Space Grotesk","Noto Sans SC",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F27; --sunk:#1C2731; --ink:#E4EBF1; --muted:#93A2B0; --line:#2B3946; --grid:#22303B;
  --warn:#E08A4F; --ok:#5DBB86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F27; --sunk:#1C2731; --ink:#E4EBF1; --muted:#93A2B0; --line:#2B3946; --grid:#22303B;
  --warn:#E08A4F; --ok:#5DBB86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-zh);font-weight:400;font-size:12px;color:var(--muted)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--f-zh);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.tabs a .dot{width:8px;height:8px;border-radius:50%}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink);background:var(--sunk);font-weight:500}
main{padding-block:20px 60px;display:grid;gap:18px}
h1{font-family:var(--f-head);font-size:24px;margin:0;text-wrap:balance;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 .en{font-size:15px;color:var(--muted);font-weight:500}
.tag{font:500 11px var(--f-mono);letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.ph{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-family:var(--f-head);font-size:15px;font-weight:700}
.ph .en{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px;font-size:13px}
.controls label{color:var(--muted)}
input[type=date]{font:13px var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.total{font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:6px;background:var(--sunk)}
.steppers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.stp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;min-width:0}
.stp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:600 14px var(--f-mono)}
.stp .v{font-family:var(--f-mono);min-width:34px;text-align:center}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 10px;font:12px var(--f-zh);cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grp{border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.grp h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.grp h4 .cnt{font:500 11px var(--f-mono);color:var(--muted)}
.bar{height:3px;background:var(--sunk);border-radius:2px;margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%}
.it{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12.5px;cursor:pointer;line-height:1.35}
.it input{margin-top:2px;accent-color:var(--ink)}
.it .en,.watch .en,.mail .en{display:block;color:var(--muted);font-size:11.5px}
.watch{display:grid;gap:8px}
.w{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:13px}
.w svg{flex:0 0 18px;margin-top:2px}
.mails{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
details.mail{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
details.mail summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
details.mail summary::-webkit-details-marker{display:none}
.code{font:600 11px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--ink);color:var(--surface)}
.trig{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}
pre.tpl{white-space:pre-wrap;font:12px/1.5 var(--f-mono);background:var(--sunk);padding:8px;border-radius:6px;margin:8px 0 6px}
table.mx{border-collapse:collapse;font-size:12.5px;min-width:620px;width:100%}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
table.mx th:first-child,table.mx td:first-child{text-align:left}
table.mx thead th{font-weight:500;color:var(--muted);font-size:11.5px}
.mxd{display:inline-block;width:12px;height:12px;border-radius:50%}
.note{font-size:12px;color:var(--muted)}
.subchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.subchips span{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:3px 8px}
.sk{font:700 12px var(--f-mono);background:var(--ink);color:var(--surface);border-radius:5px;padding:2px 7px;align-self:center}
.ph{scroll-margin-top:120px}
.sub{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;font-weight:700;font-size:13px}
.sub .en{font-size:11px;color:var(--muted);font-weight:500}
.secnav{display:flex;flex-wrap:wrap;gap:6px}
.secnav .btn b{font-family:var(--f-mono);margin-right:4px}
.bizlinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.bizlinks a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;font-size:13px}
.bizlinks a .dot{display:none}.bizlinks small{color:var(--muted);font:11px var(--f-mono)}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.docs span{font:11px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center}.docs i{width:8px;height:8px;border-radius:2px;display:inline-block}
.sumgrid,.tpl4,.radar{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sum{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}.sum .code{align-self:flex-start}
.tpl4>div,.radar>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.stds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.stds>div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.stds .n{font:600 11px var(--f-mono);color:var(--muted)}
.stds .en,.tpl4 .en,.radar .en,.sum .en{display:block;color:var(--muted);font-size:11px}
.st{font:600 10px var(--f-mono);border-radius:4px;padding:2px 6px;color:#fff}
.st-adopted{background:var(--ok)}.st-pilot{background:#2F6FB0}.st-evaluate{background:var(--warn)}
.mtg{display:grid;grid-template-columns:70px repeat(5,minmax(132px,1fr));gap:6px;min-width:760px}
.mh{font-weight:700;font-size:12px;text-align:center;padding:2px 0}
.ml{font-size:12px;align-self:center}.ml .en{display:block;color:var(--muted);font-size:10.5px}
.mc{background:var(--sunk);border-radius:6px;min-height:46px;padding:4px;display:flex;flex-direction:column;gap:4px}
.mi{text-align:left;border:1px solid var(--line);border-left:4px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:5px;padding:4px 8px;font:12px var(--f-zh);cursor:pointer}
.mi .en{display:block;color:var(--muted);font-size:10.5px}
.madd{align-self:flex-end;margin-top:auto;border:0;background:transparent;color:var(--muted);font:600 14px var(--f-mono);cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
.madd:hover,.mi:hover{background:var(--bg)}
.mform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--ink);border-radius:8px;font-size:12px}
.mform label{color:var(--muted)}
.mform input,.mform select{font:13px var(--f-zh);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
.mform input{flex:1 1 150px}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* svg */
.t{fill:var(--ink)} .tm{fill:var(--muted)} .tw{fill:#fff}
.gl{stroke:var(--grid)} .ln{stroke:var(--line)} .ink{stroke:var(--ink)}
.box{fill:var(--surface);stroke:var(--line)} .sunk{fill:var(--sunk)} .surf{fill:var(--surface)}
.mailchip{fill:var(--ink)} .mailtxt{fill:var(--surface)}
.f-m{font-family:var(--f-mono)} .f-h{font-family:var(--f-head)}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

function addDays(iso,d){const t=new Date(iso+"T00:00:00");t.setDate(t.getDate()+Math.round(d));return t}
const md=t=>`${t.getMonth()+1}/${t.getDate()}`;
const fmtW=w=>(Number.isInteger(w)?w:w.toFixed(1))+"w";
function txt(x,y,lines,o={}){const lh=o.lh||14;const cls=o.cls||"t";let s="";lines.forEach((l,i)=>{const sub=i>0&&lines.length>1;s+=`<text x="${x}" y="${y+i*lh}" class="${sub?"tm":cls} ${o.f||""}" font-size="${sub?(o.fs2||10.5):(o.fs||12.5)}" ${o.anchor?`text-anchor="${o.anchor}"`:""} ${o.w&&!sub?`font-weight="${o.w}"`:""}>${esc(l)}</text>`});return s}
function mailChip(x,y,code){const w=code.length>1?24:18;return `<g><rect x="${x}" y="${y}" width="${w}" height="15" rx="3" class="mailchip"/><text x="${x+w/2}" y="${y+11}" text-anchor="middle" class="mailtxt f-m" font-size="9.5" font-weight="600">${code}</text></g>`}
const diamond=(x,y,r,fill)=>`<polygon points="${x},${y-r} ${x+r},${y} ${x},${y+r} ${x-r},${y}" fill="${fill}" stroke="var(--surface)" stroke-width="1.5"/>`;

/* ============ GANTT ============ */
function gantt(b){
  const n=b.phases.length,ws=b.phases.map((_,i)=>wk(b,i));let acc=0;const st=ws.map(w=>{const s=acc;acc+=w;return s});const tot=acc;
  const W=84,LB=S.lang==="bi"?178:150,TOP=50,RH=50,cols=Math.ceil(tot);const width=LB+cols*W+96,h=TOP+n*RH+34;
  let g=`<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" role="img" aria-label="Gantt">`;
  for(let k=0;k<=cols;k++){const x=LB+k*W;g+=`<line x1="${x}" y1="${TOP-12}" x2="${x}" y2="${h-22}" class="gl"/>`;
    if(k<cols){g+=`<text x="${x+W/2}" y="${TOP-30}" text-anchor="middle" class="t f-m" font-size="11" font-weight="600">W${k+1}</text><text x="${x+W/2}" y="${TOP-17}" text-anchor="middle" class="tm f-m" font-size="10">${md(addDays(S.start,k*7))}</text>`}}
  b.phases.forEach((p,i)=>{const y=TOP+i*RH,x=LB+st[i]*W,w=ws[i]*W;
    g+=txt(8,y+18,L(`P${i+1} ${p.zh}`,p.en),{fs:12.5,w:500,lh:14});
    g+=`<rect x="${x+1}" y="${y+6}" width="${Math.max(w-2,8)}" height="24" rx="5" fill="${b.c}" opacity="${0.55+0.15*(i%3)}"/>`;
    g+=`<text x="${x+8}" y="${y+22}" class="tw f-m" font-size="11" font-weight="600">${fmtW(ws[i])}</text>`;
    if(p.weekly){for(let k=1;k<ws[i];k++)g+=mailChip(x+k*W-12,y+33,p.weekly)}
    (p.ms||[]).forEach((c,j)=>g+=mailChip(x+2+j*27,y-11,c));
    (p.me||[]).forEach((c,j)=>g+=mailChip(x+w-26-j*27,y-11,c));
    g+=diamond(x+w,y+18,8,"var(--ink)");
  });
  const ex=LB+tot*W;g+=`<line x1="${ex}" y1="${TOP-12}" x2="${ex}" y2="${h-18}" class="ink" stroke-dasharray="4 3"/>`;
  g+=`<text x="${ex+6}" y="${h-8}" class="t f-m" font-size="11" font-weight="600">${md(addDays(S.start,tot*7))} · ${fmtW(tot)}</text>`;
  return g+"</svg>";
}

/* ============ FLOW ============ */
const tw=(t,fs)=>[...t].reduce((a,c)=>a+(/[　-鿿＀-￯]/.test(c)?fs:fs*0.56),0);
function wrap(t,fs,max){if(tw(t,fs)<=max)return [t];const parts=t.split(/(?<=[·：:→+／/ ])/);const out=[];let cur="";parts.forEach(p=>{if(cur&&tw(cur+p,fs)>max){out.push(cur.trim());cur=p}else cur+=p});if(cur)out.push(cur.trim());
  return out.flatMap(l=>{if(tw(l,fs)<=max)return [l];const r=[];let c="";[...l].forEach(ch=>{if(tw(c+ch,fs)>max){r.push(c);c=ch}else c+=ch});if(c)r.push(c);return r})}
function flow(b){
  const n=b.phases.length,CW=228,GX=36,P=12,HH=S.lang==="bi"?50:38,TXW=CW-16-23-10;
  const cols=b.phases.map(p=>p.steps.map(s=>{const zh=S.lang==="en"?[]:wrap(s[0],12,TXW);const en=S.lang==="zh"?[]:wrap(s[1],10,TXW);const d=s[2]&&s[2]!=="—"?s[2]:"";const h=12+zh.length*15+en.length*12+(d?11:0)+2;return {zh,en,d,h:Math.max(h,28)}}));
  const stepTop=P+HH+16;const colH=cols.map(c=>c.reduce((a,x)=>a+x.h+8,0));const gateY=stepTop+Math.max(...colH)+6;
  const GH=S.lang==="bi"?40:28;const width=P*2+n*CW+(n-1)*GX,h=gateY+GH+18+28;
  let g=`<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}" role="img" aria-label="Flow">`;
  g+=`<defs><marker id="ar-${b.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  b.phases.forEach((p,i)=>{const x=P+i*(CW+GX),cx=x+CW/2;
    g+=`<line x1="${cx}" y1="${P+HH}" x2="${cx}" y2="${gateY}" class="ln" stroke-width="1.5"/>`;
    g+=`<rect x="${x}" y="${P}" width="${CW}" height="${HH}" rx="8" fill="${b.c}"/>`;
    g+=`<text x="${x+10}" y="${P+19}" class="tw f-m" font-size="11" font-weight="600">P${i+1} · ${fmtW(wk(b,i))}</text>`;
    const nm=L(p.zh,p.en);g+=`<text x="${x+10}" y="${P+35}" class="tw" font-size="12.5" font-weight="700">${esc(nm[0])}</text>`;
    if(nm[1])g+=`<text x="${x+10}" y="${P+47}" class="tw" font-size="10" opacity=".85">${esc(nm[1])}</text>`;
    let y=stepTop;cols[i].forEach(c=>{g+=`<rect x="${x+8}" y="${y}" width="${CW-16}" height="${c.h}" rx="6" class="box"/><circle cx="${x+20}" cy="${y+14}" r="3.5" fill="${b.c}"/>`;
      let ty=y+18;c.zh.forEach(l=>{g+=`<text x="${x+31}" y="${ty}" class="t" font-size="12">${esc(l)}</text>`;ty+=15});
      c.en.forEach(l=>{g+=`<text x="${x+31}" y="${ty-2}" class="tm" font-size="10">${esc(l)}</text>`;ty+=12});
      if(c.d)g+=`<text x="${x+CW-14}" y="${y+c.h-5}" text-anchor="end" class="f-m" font-size="9.5" font-weight="600" fill="${b.c}">${esc(c.d)}</text>`;
      y+=c.h+8});
    const gy=gateY,bi=S.lang==="bi";g+=`<rect x="${x+8}" y="${gy}" width="${CW-16}" height="${GH}" rx="6" fill="var(--ink)"/>`;
    g+=`<polygon points="${x+22},${gy+(bi?12:7)} ${x+29},${gy+(bi?20:14)} ${x+22},${gy+(bi?28:21)} ${x+15},${gy+(bi?20:14)}" fill="${b.c}"/>`;
    const gl=L(p.gate[0],p.gate[1]);g+=`<text x="${x+36}" y="${gy+(bi?17:18)}" class="mailtxt" font-size="12" font-weight="700">${esc(gl[0])}</text>`;
    if(gl[1])g+=`<text x="${x+36}" y="${gy+31}" class="mailtxt" font-size="10" opacity=".75">${esc(gl[1])}</text>`;
    [...(p.ms||[]),...(p.me||[]),...(p.weekly?[p.weekly]:[])].forEach((c,j)=>{g+=mailChip(x+8+j*28,gy+GH+8,c)});
    if(i<n-1)g+=`<line x1="${x+CW+4}" y1="${P+HH/2}" x2="${x+CW+GX-4}" y2="${P+HH/2}" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ar-${b.id})"/>`;
  });
  return g+"</svg>";
}

  b.phases.forEach((p,i)=>{const y=P+i*RH;g+=diamond(P+14,y+RH/2,9,b.c);g+=`<text x="${P+32}" y="${y+RH/2-(S.lang==="bi"?4:-4)}" class="tm f-m" font-size="10">P${i+1}</text>`;
    g+=txt(P+58,y+RH/2-(S.lang==="bi"?3:-4),L(p.gate[0],p.gate[1]),{fs:12.5,w:700,fs2:10,lh:14});
    {const m=[...(p.ms||[]),...(p.me||[]),...(p.weekly?[p.weekly]:[])];m.forEach((c,j)=>g+=mailChip(width-P-(m.length-j)*28,y+RH/2-8,c))}});
  return g+"</svg>";
}

/* ============ ROUTER ============ */
function cur(){const h=location.hash.slice(1);return B.find(b=>b.id===h)?h:"overview"}
function render(){
  const id=cur();
  document.querySelectorAll(".seg [data-lang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===S.lang));
  document.getElementById("tabs").innerHTML=`<a href="#overview" ${id==="overview"?'aria-current="page"':""}><span class="dot" style="background:var(--ink)"></span>${esc(L("总览","Overview").join(" "))}</a>`+B.map(b=>`<a href="#${b.id}" ${id===b.id?'aria-current="page"':""}><span class="dot" style="background:${b.c}"></span>${esc(S.lang==="en"?b.en:b.zh)}</a>`).join("");
  const m=document.getElementById("main");m.innerHTML=id==="overview"?overview():bizPage(B.find(b=>b.id===id));
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const b=B.find(x=>x.id===cur());
  if(t.dataset.medit){EDIT={i:+t.dataset.medit};render();document.getElementById("m-zh")?.focus();return}
  if(t.dataset.madd){const [d,sl]=t.dataset.madd.split("-").map(Number);EDIT={i:null,d,s:sl};render();document.getElementById("m-zh")?.focus();return}
  if(t.dataset.msave||t.dataset.mdel||t.dataset.mcancel){
    if(t.dataset.msave){const zh=document.getElementById("m-zh").value.trim(),en=document.getElementById("m-en").value.trim();if(!zh&&!en)return;const m={d:+document.getElementById("m-d").value,s:+document.getElementById("m-s").value,zh:zh||en,en};MEET=MEET.slice();if(EDIT.i!=null)MEET[EDIT.i]=m;else MEET.push(m);MPEND=null;saveMeet()}
    else if(t.dataset.mdel){MEET=MEET.filter((_,i)=>i!==EDIT.i);MPEND=null;saveMeet()}
    else if(MPEND){MEET=MPEND;MPEND=null}
    EDIT=null;render();return}
  if(t.dataset.jump){document.getElementById("sec-"+t.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.lang){S.lang=t.dataset.lang;save();render();return}
  if(t.dataset.copy){const s=MAIL[t.dataset.copy].tpl;const done=()=>{t.textContent="✓ Copied"};navigator.clipboard?.writeText(s).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("tpl-"+t.dataset.copy));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)});return}
  if(!b)return;
  if(t.dataset.size){S.size[b.id]=+t.dataset.size;delete S.ov[b.id];save();render();return}
  if(t.dataset.reset){delete S.ov[b.id];save();render();return}
  if(t.dataset.step){const i=+t.dataset.step;const o=S.ov[b.id]||(S.ov[b.id]={});o[i]=Math.max(0.5,Math.min(8,wk(b,i)+parseFloat(t.dataset.d)));save();render()}
});
document.addEventListener("change",e=>{const t=e.target;const b=B.find(x=>x.id===cur());
  if(t.closest('.mform'))return;
  if(t.type==="date"&&t.value){S.start=t.value;save();render();return}
  if(t.dataset.chk&&b){const c=S.chk[b.id]||(S.chk[b.id]={});if(t.checked)c[t.dataset.chk]=1;else delete c[t.dataset.chk];save();render();document.getElementById(t.id)?.focus()}
});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
render();
</script>
